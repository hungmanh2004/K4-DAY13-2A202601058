alerts:
  - name: User-visible latency is above SLO
    severity: warning
    condition: "latency_p95_ms > 3000 for 10m"
    type: symptom-based
    owner: On-call Observability
    runbook: docs/alerts.md#alert-1
  - name: Requests are failing above SLO
    severity: critical
    condition: "error_rate_pct > 2 for 5m"
    type: symptom-based
    owner: On-call API
    runbook: docs/alerts.md#alert-2
  - name: Answer quality is below SLO
    severity: warning
    condition: "quality_score_avg < 0.75 for 15m"
    type: symptom-based
    owner: AI Quality
    runbook: docs/alerts.md#alert-3
